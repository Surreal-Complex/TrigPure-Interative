name: Publicar no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  montar:
    if: github.repository == 'Surreal-Complex/TrigPure-Interative' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        id: pages
      - name: Instalar Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Montar e validar o site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 scripts/build-private.py --public-url "$PAGES_URL"
          node scripts/validar-site.mjs dist "$PAGES_BASE_PATH"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
